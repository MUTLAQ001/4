    <meta name="theme-color" content="#F3F6FB">
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <style>
      :root {
        --accent-color: #2F6BE0;
        --accent-hover: #2456bd;
        --dark-blue: #0A2D57;
        --bg-main: #F3F6FB;
        --bg-card: #FFFFFF;
        --bg-button: #F1F5FA;
        --bg-button-hover: #E5EDF7;
        --text-dark: #172542;
        --text-secondary: #7B879C;
        --border-soft: rgba(23, 51, 99, 0.08);
        --radius-card: 22px;
        --radius-button: 14px;
        --radius-full: 999px;
        --shadow: 0 4px 24px -10px rgba(30, 62, 115, 0.16), 0 1px 3px rgba(16, 40, 80, 0.05);
        --shadow-hover: 0 16px 36px -14px rgba(30, 62, 115, 0.24), 0 2px 6px rgba(16, 40, 80, 0.06);
        --ease-out-quint: cubic-bezier(0.22, 1, 0.36, 1);
      }

      * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html { scroll-behavior: smooth; }

      @keyframes popIn { 
        from { opacity: 0; transform: translateY(20px) scale(0.98); } 
        to { opacity: 1; transform: translateY(0) scale(1); } 
      }
      @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
      }

      body {
        font-family: 'IBM Plex Sans Arabic', sans-serif;
        background-color: var(--bg-main);
        color: var(--text-dark);
        direction: rtl;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .app-wrapper {
        max-width: 800px;
        margin: 0 auto;
        padding: 1.5rem 1.5rem 6rem;
      }
      
      .page-header {
        position: relative;
        overflow: hidden;
        background-image: linear-gradient(155deg, #1a4e91 0%, var(--dark-blue) 72%);
        color: #FFFFFF;
        padding: 2.75rem 2rem;
        border-radius: var(--radius-card);
        text-align: center;
        box-shadow: 0 18px 44px -18px rgba(10, 45, 87, 0.55);
        animation: popIn 0.8s var(--ease-out-quint) .1s both;
      }
      .page-header::before {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(120% 90% at 100% 0%, rgba(255, 255, 255, 0.14) 0%, transparent 45%);
        pointer-events: none;
      }

      .page-title {
        position: relative;
        font-size: clamp(2rem, 7vw, 2.6rem);
        font-weight: 700;
        line-height: 1.25;
        letter-spacing: -0.5px;
      }
      .page-subtitle {
        position: relative;
        font-size: 0.98rem;
        max-width: 440px;
        margin: 0.65rem auto 0;
        line-height: 1.75;
        font-weight: 400;
        opacity: 0.78;
      }
      
      .controls-container {
        margin-top: 2rem;
        margin-bottom: 2rem;
        animation: popIn 0.8s var(--ease-out-quint) .2s both;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }

      .search-container {
        position: relative;
        width: 100%;
        max-width: 550px;
      }
      
      .search-icon {
        position: absolute;
        top: 50%;
        right: 22px;
        transform: translateY(-50%);
        color: var(--text-secondary);
        transition: color 0.3s ease, transform 0.3s ease;
        pointer-events: none;
        width: 20px;
        height: 20px;
      }
      #search-input {
        width: 100%;
        padding: 1.2rem 4rem 1.2rem 1.5rem;
        background-image: linear-gradient(180deg, #FFFFFF, #F9FAFB);
        border: 2px solid transparent;
        border-radius: var(--radius-full);
        color: var(--text-dark);
        font-family: 'IBM Plex Sans Arabic', sans-serif;
        font-size: 1rem;
        font-weight: 600;
        box-shadow: 0 4px 6px -1px rgba(10, 45, 87, 0.05), 0 2px 4px -1px rgba(10, 45, 87, 0.04);
        transition: all 0.3s var(--ease-out-quint);
      }
      #search-input::placeholder { color: var(--text-secondary); }
      #search-input:focus {
        outline: none;
        border-color: var(--accent-color);
        transform: translateY(-2px);
        box-shadow: 0 0 0 4px rgba(47, 107, 224, 0.12), 0 12px 24px -8px rgba(10, 45, 87, 0.16);
      }
      #search-input:focus ~ .search-icon { 
        color: var(--text-dark);
        transform: translateY(-50%) scale(1.1);
      }
      
      .filter-container {
        display: flex;
        justify-content: center;
        gap: 2.5rem;
        width: 100%;
      }
      .filter-btn {
        background: transparent; border: none; font-family: 'IBM Plex Sans Arabic', sans-serif; font-weight: 700;
        font-size: 1.1rem; color: var(--text-secondary); cursor: pointer; padding: 0.5rem 0.25rem;
        transition: color 0.3s ease; position: relative;
      }
      .filter-btn.is-active { color: var(--accent-color); }
      .filter-btn::after {
        content: ''; position: absolute; bottom: 0; right: 0;
        width: 100%; height: 3px; background-color: var(--accent-color); border-radius: 2px;
        transform: scaleX(0); transition: transform 0.3s var(--ease-out-quint);
      }
      .filter-btn.is-active::after { transform: scaleX(1); }

      .content-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 1.25rem;
        min-height: 200px;
      }
      
      .content-card {
        background-color: var(--bg-card);
        border: 1px solid var(--border-soft);
        border-radius: var(--radius-card);
        padding: 1.5rem;
        box-shadow: var(--shadow);
        animation: popIn 0.6s var(--ease-out-quint) both;
        animation-delay: var(--animation-order, 0s);
        transition: transform 0.35s var(--ease-out-quint), box-shadow 0.35s var(--ease-out-quint);
      }
      @media (hover: hover) {
        .content-card:hover {
          transform: translateY(-4px);
          box-shadow: var(--shadow-hover);
        }
      }
      .is-filtered-out { display: none !important; }
      .is-hiding { animation: fadeOut 0.3s ease-out forwards; animation-delay: var(--animation-order, 0s); }
      .is-showing { animation: popIn 0.6s var(--ease-out-quint) both; animation-delay: var(--animation-order, 0s); }
      
      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.15rem;
        padding-bottom: 1.15rem;
        border-bottom: 1px solid var(--border-soft);
      }
      .card-title-group {
        display: flex;
        align-items: center;
        gap: 0.9rem;
        flex-direction: row-reverse;
      }
      .card-header .title { font-size: 1.3rem; font-weight: 700; color: var(--text-dark); letter-spacing: -0.2px; }
      .card-header .icon-wrapper {
        width: 42px; height: 42px;
        border-radius: 12px;
        background-color: var(--bg-button);
        color: var(--accent-color);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .card-header .icon-wrapper svg { width: 22px; height: 22px; }

      .links-group { display: flex; flex-direction: column; gap: 0.75rem; }
      .location-link {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.6rem 0.85rem;
        border-radius: var(--radius-button);
        background: var(--bg-button);
        border: 1px solid transparent;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.98rem;
        transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
        color: var(--text-dark);
      }
      .location-link:hover {
        background-color: var(--bg-button-hover);
        border-color: var(--border-soft);
      }
      .location-link:active { transform: scale(0.99); }
      .link-main-content {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .location-link svg { width: 19px; height: 19px; color: var(--accent-color); flex-shrink: 0; }
      
      .building-badge {
        min-width: 32px; height: 32px;
        padding: 0 0.5rem;
        border-radius: 8px;
        background: var(--accent-color); color: white;
        display: flex; align-items: center; justify-content: center;
        font-size: 0.9rem; font-weight: 700; flex-shrink: 0;
        box-shadow: 0 2px 6px -1px rgba(47, 107, 224, 0.35);
      }
      
      .link-actions {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }
      .map-btn-small {
        width: 32px; height: 32px;
        border-radius: 8px;
        background: var(--bg-main);
        color: var(--accent-color);
        display: flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        flex-shrink: 0;
        transition: background-color 0.2s ease, transform 0.2s ease;
        cursor: pointer;
      }
      .map-btn-small svg { width: 17px; height: 17px; }
      .map-btn-small:hover {
        background-color: var(--bg-button-hover);
        transform: scale(1.08);
      }
      
      .empty-state { display: none; grid-column: 1 / -1; justify-content: center; align-items: center; text-align: center; padding: 4rem 1.5rem; flex-direction: column; gap: 1.5rem; color: var(--text-dark); }
      .empty-state.is-visible { display: flex; }
      .empty-state .icon { width: 52px; height: 52px; color: var(--accent-color); opacity: 0.45; stroke-width: 1.75; }
      .empty-state span { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.5rem; }
      .empty-state .reset-btn { background: var(--accent-color); color: white; border: none; padding: 0.8rem 2rem; border-radius: var(--radius-full); font-family: 'IBM Plex Sans Arabic', sans-serif; font-size: 1rem; font-weight: 700; cursor: pointer; transition: transform 0.2s ease; }
      .empty-state .reset-btn:hover { transform: scale(1.05); }

      .page-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background-color: var(--dark-blue);
        color: white;
        padding: 0.75rem 1.5rem;
        font-weight: 600;
        font-size: 0.9rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        z-index: 20;
      }
      .footer-link {
        color: white;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        opacity: 0.8;
        transition: opacity 0.2s ease;
        flex-direction: row-reverse;
      }
      .footer-link:hover {
        opacity: 1;
      }
      .footer-link .icon-bg {
        width: 28px; height: 28px;
        border-radius: 50%;
        background-color: var(--accent-color);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .footer-link .icon-bg svg { width: 15px; height: 15px; }
    </style>
</head>

                ]},
                { category: 'deanships', title: 'العمادات', icon: 'building-2', links: [ { href: "https://maps.app.goo.gl/SGGQX3GqQjDU9Cc6A", icon: "id-card", text: "عمادة القبول والتسجيل", building: "A7" }, { href: "https://maps.app.goo.gl/uavC8yXQFrNfrnR16", icon: "users-round", text: "عمادة شؤون الطلاب", building: "A7" }, { href: "https://maps.app.goo.gl/uL7L58xZxehJ4pqt7", icon: "book-open", text: "عمادة الدراسات العليا والبحث العلمي", building: "A7" }, { href: "https://maps.app.goo.gl/4zfgdfTRLjNhVCAD9", icon: "monitor", text: "عمادة التعلم الإلكتروني وتقنية المعلومات", building: "A7" } ] },
                { category: 'facilities', title: 'المرافق والخدمات', icon: 'signpost', links: [ { href: "https://www.google.com/maps/place//data=!4m2!3m1!1s0x158201c7a8c21d91:0xedc23a33b8b771a4", iconSvg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M5.723 4.021 A9.3 9.3 0 1 1 5.723 19.979 A8 8 0 0 0 5.723 4.021 Z"/></svg>', text: "المدينة الطبية" }, { href: "https://www.google.com/maps/place//data=!4m2!3m1!1s0x158201c8cbe278f7:0xb16f62d6ae48782", icon: "stethoscope", text: "العيادات الخارجية" }, { href: "https://maps.app.goo.gl/kP97DjbXH2CpSUUE8", icon: "car", text: "مدرسة تعليم القيادة" }, { href: "https://maps.app.goo.gl/Fswf7gNWLw4ikM2B9", icon: "shield", text: "الأمن الجامعي", building: "A16" }, { href: "https://goo.gl/maps/hUDYwKSKuPqRuBz36", icon: "dumbbell", text: "النادي الرياضي" }, { href: "https://maps.app.goo.gl/2CEU2VFW5bPPCZUV8", icon: "goal", text: "ملعب الجامعة" }, { href: "https://maps.app.goo.gl/YnZUmvuQzq5s6wsV8", icon: "mic", text: "مركز الملك عبدالعزيز للمؤتمرات" }, { href: "https://maps.app.goo.gl/SbvFZ5XCKpAtdLsS9", icon: "lightbulb", text: "مركز ريادة الأعمال الرقمية | كود" }, { href: "https://maps.app.goo.gl/sdy9NRSA6iT8WXn68", icon: "building", text: "إدارة السكن", building: "G4" }, { href: "https://maps.app.goo.gl/rCG7yk96fjyPBS4T8", icon: "bed", text: "السكن الطلابي (بنين)", building: "G" } ] }
            ];
            
            const FLATTENED_DATA = [];
            SITE_DATA_RAW.forEach(category => {
                if (category.type === 'multi-department') {
                    category.departments.forEach(dept => FLATTENED_DATA.push({ ...dept, category: category.category }));
                } else { FLATTENED_DATA.push(category); }
            });

            const PRIMARY_FILTERS = [ { id: 'deanships', text: 'العمادات' }, { id: 'colleges', text: 'الكليات' }, { id: 'facilities', text: 'المرافق' } ];
            const DEFAULT_FILTER = 'colleges';
            
            const grid = document.getElementById('content-grid'), 
                  emptyState = document.getElementById('empty-state'),
                  searchInput = document.getElementById('search-input'),
                  filterContainer = document.getElementById('filter-container');
            let activePrimaryFilterId = DEFAULT_FILTER;

            const createCardHTML = (cardData, index) => {
                const header = `
                    <div class="card-header">
                        <div class="card-title-group">
                            <h2 class="title">${cardData.title}</h2>
                            <div class="icon-wrapper"><i data-lucide="${cardData.icon}"></i></div>
                        </div>
                    </div>`;
                
                const createLinksGroup = links => `<div class="links-group">${links.map(link => {
                    const badgeHTML = link.building ? `<div class="building-badge">${link.building}</div>` : '';
                    
                    const mapButtonHTML = link.map_pdf
                        ? `<div role="button" onclick="event.preventDefault(); event.stopPropagation(); window.open('${link.map_pdf}', '_blank');" class="map-btn-small" title="مخطط المبنى"><i data-lucide="map"></i></div>`
                        : '';
                    
                    return `<a href="${link.href}" target="_blank" rel="noopener noreferrer" class="location-link">
                                <div class="link-main-content">
                                    ${link.iconSvg ? link.iconSvg : `<i data-lucide="${link.icon}"></i>`}
                                    <span>${link.text}</span>
                                </div>
                                <div class="link-actions">
                                    ${mapButtonHTML}
                                    ${badgeHTML}
                                </div>
                            </a>`;
                }).join('')}</div>`;

                const body = createLinksGroup(cardData.links);
                return `<section class="content-card is-filtered-out" data-category="${cardData.category}" style="--animation-order: ${index * 50}ms">${header}${body}</section>`;
            };
            
            const filterContent = () => {
                const searchQuery = searchInput.value.toLowerCase().trim();
                const cards = Array.from(grid.querySelectorAll('.content-card'));
                let visibleCardCount = 0;

                cards.forEach(card => {
                    const categoryMatch = card.dataset.category === activePrimaryFilterId;
                    const searchMatch = searchQuery === '' || card.textContent.toLowerCase().includes(searchQuery);
                    const shouldShow = categoryMatch && searchMatch;

                    if (shouldShow) {
                        const wasHidden = card.classList.contains('is-filtered-out');
                        card.classList.remove('is-filtered-out', 'is-hiding');
                        if (wasHidden) {
                            card.style.setProperty('--animation-order', `${visibleCardCount * 45}ms`);
                            card.classList.remove('is-showing');
                            void card.offsetWidth;
                            card.classList.add('is-showing');
                        }
                        visibleCardCount++;
                    } else {
                        card.classList.add('is-filtered-out');
                        card.classList.remove('is-showing', 'is-hiding');
                    }
                });

                emptyState.classList.toggle('is-visible', visibleCardCount === 0);
            };
            
            const initFilters = () => {
                filterContainer.innerHTML = PRIMARY_FILTERS.map(f => 
                    `<button class="filter-btn" data-filter="${f.id}">${f.text}</button>`
                ).join('');

                const filterButtons = filterContainer.querySelectorAll('.filter-btn');

                const handleFilterClick = (e) => {
                    const targetButton = e.currentTarget;
                    const newFilterId = targetButton.dataset.filter;
                    
                    if (activePrimaryFilterId === newFilterId) return;
                    activePrimaryFilterId = newFilterId;

                    filterButtons.forEach(btn => btn.classList.remove('is-active'));
                    targetButton.classList.add('is-active');

                    filterContent();
                };

                filterButtons.forEach(btn => btn.addEventListener('click', handleFilterClick));
                
                return {
                    setActive: (filterId) => {
                        activePrimaryFilterId = filterId;
                        filterButtons.forEach(btn => {
                            btn.classList.toggle('is-active', btn.dataset.filter === filterId);
                        });
                        filterContent();
                    },
                    activateDefault: () => {
                      const defaultButton = filterContainer.querySelector(`[data-filter="${DEFAULT_FILTER}"]`);
                      if(defaultButton) defaultButton.classList.add('is-active');
                    }
                };
            };
            
            const initialize = () => {
                const cardHTML = FLATTENED_DATA.map(createCardHTML).join('');
                grid.insertAdjacentHTML('afterbegin', cardHTML);

                if (window.lucide) lucide.createIcons();

                const filterManager = initFilters();
                
                document.getElementById('reset-filter-btn').addEventListener('click', () => {
                    searchInput.value = '';
                    filterManager.setActive(DEFAULT_FILTER);
                });

                searchInput.addEventListener('input', filterContent);
                
                filterManager.activateDefault();
                filterContent(); 
            };

            initialize();
        });
    </script>
</body>
</html>
