<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليل مواقع جامعة القصيم</title>
    <meta name="description" content="وصول سريع ومنظم لجميع مواقع الكليات والعمادات والمرافق بجامعة القصيم.">
    <meta name="theme-color" content="#0f2b48">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Alexandria:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0f2b48;
            --primary-deep: #0a1f36;
            --secondary-color: #179c8e;
            --secondary-bright: #4dd8c8;
            --secondary-soft: rgba(23, 156, 142, 0.1);
            --page-bg: #eef3f9;
            --card-bg: #ffffff;
            --card-border: #e3eaf2;
            --text-dark: #22303e;
            --text-gray: #7d8a97;

            --colleges-color: #3498db;
            --colleges-text: #217dbb;
            --deanships-color: #179c8e;
            --deanships-text: #0e6f64;
            --facilities-color: #e67e22;
            --facilities-text: #c2661a;

            --header-grad-1: #0f2b48;
            --header-grad-2: #14385d;
            --header-grad-3: #11554f;
            --shadow-soft: 0 4px 15px rgba(15, 43, 72, 0.05);
            --shadow-hover: 0 12px 30px rgba(15, 43, 72, 0.1);
        }

        body.dark {
            --primary-color: #cfe3f5;
            --primary-deep: #060e18;
            --secondary-color: #2fc4b4;
            --secondary-bright: #4dd8c8;
            --secondary-soft: rgba(47, 196, 180, 0.12);
            --page-bg: #0d1520;
            --card-bg: #16202e;
            --card-border: #24344a;
            --text-dark: #e6edf5;
            --text-gray: #8fa0b3;

            --colleges-text: #5db4ec;
            --deanships-text: #4dd8c8;
            --facilities-text: #f39c4a;

            --header-grad-1: #0a1826;
            --header-grad-2: #0f2438;
            --header-grad-3: #0c3531;
            --shadow-soft: 0 4px 15px rgba(0, 0, 0, 0.3);
            --shadow-hover: 0 12px 30px rgba(0, 0, 0, 0.45);
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'IBM Plex Sans Arabic', sans-serif;
            background-color: var(--page-bg);
            margin: 0;
            padding: 0 0 100px 0;
            color: var(--text-dark);
            min-height: 100vh;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .page-hero {
            background: linear-gradient(135deg, var(--header-grad-1) 0%, var(--header-grad-2) 55%, var(--header-grad-3) 100%);
            padding: 50px 20px 115px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .page-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
            background-size: 26px 26px;
            pointer-events: none;
        }

        .page-hero::after {
            content: '';
            position: absolute;
            top: -90px;
            left: -90px;
            width: 280px;
            height: 280px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(23,156,142,0.28), transparent 70%);
            pointer-events: none;
        }

        .hero-inner { position: relative; z-index: 2; }

        .uni-eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(255,255,255,0.75);
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 12px;
        }

        .uni-eyebrow::before, .uni-eyebrow::after {
            content: '';
            width: 28px;
            height: 1px;
            background: rgba(255,255,255,0.3);
        }

        .page-title {
            font-family: 'Alexandria', 'IBM Plex Sans Arabic', sans-serif;
            color: #ffffff;
            font-size: 34px;
            font-weight: 800;
            margin: 0;
            line-height: 1.3;
        }

        .page-subtitle {
            color: rgba(255,255,255,0.72);
            font-size: 14.5px;
            line-height: 1.9;
            max-width: 430px;
            margin: 12px auto 0 auto;
        }

        .theme-toggle {
            position: absolute;
            top: 18px;
            left: 18px;
            z-index: 5;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.22);
            background: linear-gradient(150deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
            backdrop-filter: blur(8px);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(0,0,0,0.18);
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease, background 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.08);
            box-shadow: 0 6px 18px rgba(0,0,0,0.25);
            background: linear-gradient(150deg, rgba(255,255,255,0.24), rgba(255,255,255,0.06));
        }

        .theme-toggle:active { transform: scale(0.94); }
        .theme-toggle:focus-visible { outline: 2px solid var(--secondary-bright); outline-offset: 3px; }

        .theme-toggle i {
            position: absolute;
            font-size: 17px;
            transition: opacity 0.35s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .theme-toggle .icon-moon { color: #eaf1fb; opacity: 1; transform: rotate(0deg) scale(1); }
        .theme-toggle .icon-sun { color: #fbbf24; opacity: 0; transform: rotate(-70deg) scale(0.4); }

        body.dark .theme-toggle .icon-moon { opacity: 0; transform: rotate(70deg) scale(0.4); }
        body.dark .theme-toggle .icon-sun { opacity: 1; transform: rotate(0deg) scale(1); }

        .container {
            max-width: 900px;
            margin: 0 auto 30px auto;
            padding: 0 20px;
        }

        .search-section {
            display: flex;
            justify-content: center;
            margin-top: -70px;
            margin-bottom: 40px;
            position: relative;
            z-index: 3;
        }

        .search-card {
            width: 100%;
            max-width: 540px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            box-shadow: 0 20px 45px rgba(10, 31, 54, 0.18);
            padding: 16px;
            transition: background-color 0.4s ease;
        }

        .search-field { position: relative; }

        .search-field .fa-magnifying-glass {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            color: var(--text-gray);
            font-size: 15px;
            pointer-events: none;
            transition: color 0.3s ease;
        }

        #searchInput {
            width: 100%;
            padding: 15px 50px 15px 46px;
            border-radius: 50px;
            border: 1.5px solid var(--card-border);
            background-color: var(--page-bg);
            color: var(--text-dark);
            font-family: inherit;
            font-size: 15px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }

        #searchInput::placeholder { color: var(--text-gray); font-weight: 500; }
        #searchInput::-webkit-search-cancel-button { display: none; }

        #searchInput:focus {
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 4px var(--secondary-soft);
        }

        #searchInput:focus + .fa-magnifying-glass { color: var(--secondary-color); }

        .clear-search {
            position: absolute;
            top: 50%;
            left: 14px;
            transform: translateY(-50%) scale(0.6);
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 50%;
            background-color: var(--card-border);
            color: var(--text-gray);
            font-size: 13px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .clear-search.visible { opacity: 1; transform: translateY(-50%) scale(1); pointer-events: auto; }
        .clear-search:hover { color: var(--text-dark); }

        .section-title {
            font-family: 'Alexandria', sans-serif;
            color: var(--text-dark);
            text-align: center;
            margin: 0 0 12px 0;
            font-size: 22px;
            font-weight: 700;
        }

        .title-divider {
            width: 70px;
            height: 4px;
            background: linear-gradient(90deg, var(--secondary-color), var(--secondary-bright));
            margin: 0 auto 12px auto;
            border-radius: 4px;
        }

        .nav-tabs {
            position: relative;
            display: flex;
            gap: 4px;
            max-width: 470px;
            margin: 4px auto 40px auto;
            padding: 6px;
            background-color: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 50px;
            box-shadow: var(--shadow-soft);
            transition: background-color 0.4s ease;
        }

        .nav-indicator {
            position: absolute;
            top: 6px;
            bottom: 6px;
            left: 0;
            width: 0;
            border-radius: 50px;
            z-index: 0;
            background: linear-gradient(135deg, #4aa8e0, #2b83c2);
        }

        .nav-tabs.ready .nav-indicator {
            transition: transform 0.5s cubic-bezier(0.34, 1.35, 0.64, 1), width 0.5s cubic-bezier(0.34, 1.35, 0.64, 1), background 0.4s ease, box-shadow 0.4s ease;
        }

        .nav-indicator.colleges { background: linear-gradient(135deg, #4aa8e0, #2b83c2); box-shadow: 0 8px 20px rgba(43, 131, 194, 0.38); }
        .nav-indicator.deanships { background: linear-gradient(135deg, #22b3a3, #128577); box-shadow: 0 8px 20px rgba(18, 133, 119, 0.38); }
        .nav-indicator.facilities { background: linear-gradient(135deg, #f0a35a, #dd8027); box-shadow: 0 8px 20px rgba(221, 128, 39, 0.38); }

        .nav-tab {
            position: relative;
            z-index: 1;
            flex: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            padding: 12px 8px;
            border: none;
            border-radius: 50px;
            background: transparent;
            color: var(--text-gray);
            font-family: inherit;
            font-size: 14.5px;
            font-weight: 700;
            cursor: pointer;
            transition: color 0.35s ease, transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-tab i { font-size: 13.5px; opacity: 0.9; transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
        .nav-tab:hover { color: var(--text-dark); }
        .nav-tab:hover i { transform: translateY(-2px); }
        .nav-tab:active { transform: scale(0.96); }
        .nav-tab:focus-visible { outline: 2px solid var(--secondary-color); outline-offset: 3px; }
        .nav-tab.selected { color: #fff; }
        .nav-tab.selected i { opacity: 1; }

        .cards-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
        }

        @media (min-width: 769px) {
            .cards-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: start; }
        }

        .place-card {
            min-width: 0;
            border: 2px solid transparent;
            border-radius: 18px;
            background-color: var(--card-bg);
            box-shadow: var(--shadow-soft);
            padding: 20px 22px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.3s, background-color 0.4s ease;
        }

        .place-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); }

        .place-card.colleges {
            background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                        linear-gradient(135deg, #4aa8e0, #2b83c2) border-box;
        }
        .place-card.deanships {
            background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                        linear-gradient(135deg, #22b3a3, #128577) border-box;
        }
        .place-card.facilities {
            background: linear-gradient(var(--card-bg), var(--card-bg)) padding-box,
                        linear-gradient(135deg, #f0a35a, #dd8027) border-box;
        }

        .card-head {
            display: flex;
            align-items: center;
            gap: 12px;
            padding-bottom: 16px;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--card-border);
        }

        .type-icon {
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: #fff;
        }

        .colleges .type-icon { background: linear-gradient(135deg, #4aa8e0, #2b83c2); }
        .deanships .type-icon { background: linear-gradient(135deg, #22b3a3, #128577); }
        .facilities .type-icon { background: linear-gradient(135deg, #f0a35a, #dd8027); }

        .card-title {
            min-width: 0;
            overflow-wrap: anywhere;
            font-family: 'Alexandria', sans-serif;
            font-size: 17px;
            font-weight: 600;
            margin: 0;
            line-height: 1.4;
        }

        .colleges .card-title { color: var(--colleges-text); }
        .deanships .card-title { color: var(--deanships-text); }
        .facilities .card-title { color: var(--facilities-text); }

        .links-list { display: flex; flex-direction: column; gap: 10px; }

        .loc-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            min-width: 0;
            padding: 11px 14px;
            border-radius: 14px;
            background-color: var(--page-bg);
            border: 1px solid var(--card-border);
            text-decoration: none;
            color: var(--text-dark);
            font-size: 14.5px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .loc-link:hover {
            border-color: var(--secondary-color);
            transform: translateX(-4px);
            box-shadow: 0 8px 20px rgba(23, 156, 142, 0.14);
        }

        .loc-link:active { transform: scale(0.98); }

        .loc-main { display: flex; align-items: center; gap: 11px; min-width: 0; flex: 1; }
        .loc-main > span { min-width: 0; line-height: 1.6; overflow-wrap: anywhere; }
        .loc-main i { color: var(--secondary-color); font-size: 14px; width: 16px; text-align: center; flex-shrink: 0; }
        .loc-main svg { width: 16px; height: 16px; color: var(--secondary-color); flex-shrink: 0; }

        .loc-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

        .building-badge {
            min-width: 36px;
            padding: 4px 11px;
            border-radius: 50px;
            background: var(--secondary-soft);
            color: var(--secondary-color);
            font-size: 13px;
            font-weight: 700;
            text-align: center;
            direction: ltr;
        }

        .map-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 50px;
            border: 1.5px solid var(--card-border);
            background-color: var(--card-bg);
            color: var(--text-gray);
            font-family: inherit;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .map-btn:hover {
            border-color: var(--secondary-color);
            color: var(--secondary-color);
            transform: translateY(-2px);
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 50px 20px;
            color: var(--text-gray);
        }

        .empty-state.visible { display: block; }
        .empty-state i { font-size: 40px; color: var(--secondary-color); opacity: 0.5; margin-bottom: 18px; }
        .empty-state p { font-size: 16px; font-weight: 700; color: var(--text-dark); margin: 0 0 20px 0; }

        .reset-btn {
            background: var(--primary-deep);
            color: #fff;
            border: none;
            padding: 11px 28px;
            border-radius: 50px;
            font-family: inherit;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .reset-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(15, 43, 72, 0.25); }
        body.dark .reset-btn { background: var(--secondary-color); color: #06211d; }

        .page-footer {
            background-color: var(--card-bg);
            padding: 14px 20px;
            text-align: center;
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            box-shadow: 0 -5px 25px rgba(0,0,0,0.06);
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            z-index: 1000;
            transition: background-color 0.4s ease;
        }

        .footer-link {
            display: inline-flex;
            flex-direction: row-reverse;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 700;
            font-size: 14px;
            background-color: var(--page-bg);
            border: 1px solid var(--card-border);
            padding: 11px 24px;
            border-radius: 50px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .footer-link:hover {
            border-color: var(--secondary-color);
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(23, 156, 142, 0.15);
        }

        .icon-bg { color: var(--secondary-color); font-size: 17px; }

        .reveal { opacity: 0; transform: translateY(18px); transition: opacity 0.6s ease, transform 0.6s ease; }
        .reveal.visible { opacity: 1; transform: translateY(0); }

        .filter-hidden { display: none !important; }

        @media (max-width: 768px) {
            .page-title { font-size: 27px; }
            .page-hero { padding: 44px 18px 100px 18px; }
            .footer-link { padding: 10px 18px; font-size: 13px; }
            .nav-tabs { max-width: 100%; }
            .nav-tab { font-size: 13px; padding: 11px 4px; gap: 7px; }
            .nav-tab i { font-size: 12px; }
        }
    </style>
</head>
<body>
    <header class="page-hero">
        <button class="theme-toggle" id="theme-toggle" aria-label="تبديل الوضع الليلي"><i class="fas fa-moon icon-moon"></i><i class="fas fa-sun icon-sun"></i></button>
        <div class="hero-inner">
            <div class="uni-eyebrow">جامعة القصيم</div>
            <h1 class="page-title">دليل مواقع الجامعة</h1>
            <p class="page-subtitle">وصول سريع ومنظم لجميع مواقع الكليات والعمادات والمرافق داخل الحرم الجامعي.</p>
        </div>
    </header>

    <div class="container">
        <div class="search-section">
            <div class="search-card">
                <div class="search-field">
                    <input type="search" id="searchInput" placeholder="ابحث عن كلية، عمادة، مرفق..." aria-label="صندوق البحث">
                    <i class="fas fa-magnifying-glass"></i>
                    <button class="clear-search" id="clearSearch" aria-label="مسح البحث"><i class="fas fa-xmark"></i></button>
                </div>
            </div>
        </div>

        <h2 class="section-title">مواقع الحرم الجامعي</h2>
        <div class="title-divider"></div>

        <nav class="nav-tabs" id="navTabs"><span class="nav-indicator" id="navIndicator"></span></nav>

        <div class="cards-grid" id="cardsGrid"></div>

        <div class="empty-state" id="emptyState">
            <i class="fas fa-magnifying-glass-location"></i>
            <p>لا توجد نتائج تطابق بحثك.</p>
            <button class="reset-btn" id="resetBtn">عرض الكل</button>
        </div>
    </div>

    <footer class="page-footer">
        <a href="https://t.me/Qassim_U" class="footer-link" target="_blank" rel="noopener noreferrer">
            <span class="icon-bg"><i class="fas fa-users"></i></span>
            <span>Qassim_U</span>
        </a>
        <a href="https://t.me/Qassim_QU" class="footer-link" target="_blank" rel="noopener noreferrer">
            <span class="icon-bg"><i class="fas fa-bullhorn"></i></span>
            <span>Qassim_QU</span>
        </a>
    </footer>

    <script>
        (function () {
            try {
                const btn = document.getElementById('theme-toggle');
                let saved = null;
                try { saved = localStorage.getItem('qu-theme'); } catch (e) {}

                if (saved === 'dark') {
                    document.body.classList.add('dark');
                    document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0a1826');
                }

                btn.addEventListener('click', function () {
                    const isDark = document.body.classList.toggle('dark');
                    document.querySelector('meta[name="theme-color"]').setAttribute('content', isDark ? '#0a1826' : '#0f2b48');
                    try { localStorage.setItem('qu-theme', isDark ? 'dark' : 'light'); } catch (e) {}
                });
            } catch (e) { console.error(e); }
        })();

        document.addEventListener('DOMContentLoaded', () => {
            const SITE_DATA_RAW = [
                { category: 'colleges', title: 'الكليات', icon: 'fa-graduation-cap', type: 'multi-department', departments: [
                    { title: "كلية الحاسب", icon: "fa-laptop-code", links: [
                        { href: "https://maps.app.goo.gl/aM5wytWf1N4fiKE3A", text: "طلاب", icon: "fa-location-dot", building: "C1", map_pdf: "maps/map-college-of-computer-c1.pdf" },
                        { href: "https://maps.app.goo.gl/nfvJK3LXANxUvGMR7", text: "طالبات", icon: "fa-location-dot", building: "F5", map_pdf: "maps/map-college-of-computer-f5.pdf" },
                        { href: "https://maps.app.goo.gl/FpWckdfczc1Zw9SGA", text: "مقر الرس - طلاب", icon: "fa-location-dot" },
                        { href: "https://maps.app.goo.gl/ziGGqiiRmVWgAsK77", text: "مقر الرس - طالبات", icon: "fa-location-dot" },

                { category: 'facilities', title: 'المرافق والخدمات', icon: 'fa-signs-post', links: [ { href: "https://www.google.com/maps/place//data=!4m2!3m1!1s0x158201c7a8c21d91:0xedc23a33b8b771a4", iconSvg: '<svg viewBox="0 0 24 24"><path fill="currentColor" d="M5.723 4.021 A9.3 9.3 0 1 1 5.723 19.979 A8 8 0 0 0 5.723 4.021 Z"/></svg>', text: "المدينة الطبية" }, { href: "https://www.google.com/maps/place//data=!4m2!3m1!1s0x158201c8cbe278f7:0xb16f62d6ae48782", icon: "fa-stethoscope", text: "العيادات الخارجية" }, { href: "https://maps.app.goo.gl/kP97DjbXH2CpSUUE8", icon: "fa-car", text: "مدرسة تعليم القيادة" }, { href: "https://maps.app.goo.gl/Fswf7gNWLw4ikM2B9", icon: "fa-shield-halved", text: "الأمن الجامعي", building: "A16" }, { href: "https://goo.gl/maps/hUDYwKSKuPqRuBz36", icon: "fa-dumbbell", text: "النادي الرياضي" }, { href: "https://maps.app.goo.gl/2CEU2VFW5bPPCZUV8", icon: "fa-futbol", text: "ملعب الجامعة" }, { href: "https://maps.app.goo.gl/YnZUmvuQzq5s6wsV8", icon: "fa-microphone", text: "مركز الملك عبدالعزيز للمؤتمرات" }, { href: "https://maps.app.goo.gl/SbvFZ5XCKpAtdLsS9", icon: "fa-lightbulb", text: "مركز ريادة الأعمال الرقمية | كود" }, { href: "https://maps.app.goo.gl/sdy9NRSA6iT8WXn68", icon: "fa-building", text: "إدارة السكن", building: "G4" }, { href: "https://maps.app.goo.gl/rCG7yk96fjyPBS4T8", icon: "fa-bed", text: "السكن الطلابي (بنين)", building: "G" } ] }
            ];

            const FLATTENED_DATA = [];
            SITE_DATA_RAW.forEach(category => {
                if (category.type === 'multi-department') {
                    category.departments.forEach(dept => FLATTENED_DATA.push({ ...dept, category: category.category }));
                } else { FLATTENED_DATA.push(category); }
            });

            const PRIMARY_FILTERS = [ { id: 'deanships', text: 'العمادات', icon: 'fa-building-columns' }, { id: 'colleges', text: 'الكليات', icon: 'fa-graduation-cap' }, { id: 'facilities', text: 'المرافق', icon: 'fa-signs-post' } ];
            const DEFAULT_FILTER = 'colleges';

            const grid = document.getElementById('cardsGrid');
            const emptyState = document.getElementById('emptyState');
            const searchInput = document.getElementById('searchInput');
            const clearSearch = document.getElementById('clearSearch');
            const navTabs = document.getElementById('navTabs');
            const navIndicator = document.getElementById('navIndicator');

            let activeFilter = DEFAULT_FILTER;

            const normalize = value => value.toLowerCase()
                .replace(/[\u064B-\u0652\u0640]/g, '')
                .replace(/[أإآٱ]/g, 'ا')
                .replace(/ى/g, 'ي')
                .replace(/[ؤئ]/g, 'ء')
                .replace(/ة/g, 'ه')
                .replace(/\s+/g, ' ')
                .trim();

            const createCardHTML = cardData => {
                const linksHTML = cardData.links.map(link => {
                    const badge = link.building ? `<span class="building-badge">${link.building}</span>` : '';
                    const mapBtn = link.map_pdf
                        ? `<button type="button" class="map-btn" data-pdf="${link.map_pdf}" title="مخطط المبنى"><i class="fas fa-map"></i><span>مخطط</span></button>`
                        : '';
                    const icon = link.iconSvg ? link.iconSvg : `<i class="fas ${link.icon}"></i>`;

                    return `<a href="${link.href}" target="_blank" rel="noopener noreferrer" class="loc-link">
                                <span class="loc-main">${icon}<span>${link.text}</span></span>
                                <span class="loc-actions">${mapBtn}${badge}</span>
                            </a>`;
                }).join('');

                const searchable = normalize(cardData.title + ' ' + cardData.links.map(l => l.text + ' ' + (l.building || '')).join(' '));

                return `<section class="place-card ${cardData.category} reveal" data-category="${cardData.category}" data-search="${searchable}">
                            <div class="card-head">
                                <span class="type-icon"><i class="fas ${cardData.icon}"></i></span>
                                <h3 class="card-title">${cardData.title}</h3>
                            </div>
                            <div class="links-list">${linksHTML}</div>
                        </section>`;
            };

            const applyFilters = () => {
                const query = normalize(searchInput.value);
                let visible = 0;

                grid.querySelectorAll('.place-card').forEach(card => {
                    const match = card.dataset.category === activeFilter && (query === '' || card.dataset.search.includes(query));
                    card.classList.toggle('filter-hidden', !match);
                    if (match) {
                        visible++;
                        card.classList.add('visible');
                    }
                });

                clearSearch.classList.toggle('visible', searchInput.value.length > 0);
                emptyState.classList.toggle('visible', visible === 0);
                grid.style.display = visible === 0 ? 'none' : '';
            };

            const moveIndicator = () => {
                const activeTab = navTabs.querySelector('.nav-tab.selected');
                if (!activeTab) return;
                navIndicator.style.width = activeTab.offsetWidth + 'px';
                navIndicator.style.transform = `translateX(${activeTab.offsetLeft}px)`;
                navIndicator.className = 'nav-indicator ' + activeFilter;
            };

            const setFilter = filterId => {
                activeFilter = filterId;
                navTabs.querySelectorAll('.nav-tab').forEach(tab => tab.classList.toggle('selected', tab.dataset.filter === filterId));
                moveIndicator();
                applyFilters();
            };

            navTabs.insertAdjacentHTML('beforeend', PRIMARY_FILTERS.map(f =>
                `<button class="nav-tab" data-filter="${f.id}"><i class="fas ${f.icon}"></i><span>${f.text}</span></button>`
            ).join(''));

            grid.innerHTML = FLATTENED_DATA.map(createCardHTML).join('');

            navTabs.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    if (activeFilter !== tab.dataset.filter) setFilter(tab.dataset.filter);
                });
            });

            window.addEventListener('resize', moveIndicator);
            document.fonts.ready.then(moveIndicator);

            grid.addEventListener('click', e => {
                const mapBtn = e.target.closest('.map-btn');
                if (!mapBtn) return;
                e.preventDefault();
                e.stopPropagation();
                window.open(mapBtn.dataset.pdf, '_blank');
            });

            searchInput.addEventListener('input', applyFilters);

            clearSearch.addEventListener('click', () => {
                searchInput.value = '';
                searchInput.focus();
                applyFilters();
            });

            document.getElementById('resetBtn').addEventListener('click', () => {
                searchInput.value = '';
                setFilter(DEFAULT_FILTER);
            });

            setFilter(DEFAULT_FILTER);
            requestAnimationFrame(() => {
                moveIndicator();
                navTabs.classList.add('ready');
            });
        });
    </script>
